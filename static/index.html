<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interview Coach</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --panel: #fff;
            --ink: #1c2430;
            --muted: #6b7686;
            --line: #e2e7ee;
            --accent: #1f4fd8;
            --bot: #eef2f9;
            --rec: #d92d20
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Segoe UI", system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center
        }

        .app {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line)
        }

        header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--line)
        }

        header h1 {
            margin: 0;
            font-size: 1.15rem
        }

        header p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: .88rem
        }

        .setup {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding: 14px 24px;
            border-bottom: 1px solid var(--line);
            background: #fafbfd
        }

        select,
        input[type=text],
        button {
            font: inherit;
            border-radius: 8px;
            border: 1px solid var(--line);
            padding: 9px 12px
        }

        button {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            cursor: pointer
        }

        button.ghost {
            background: #fff;
            color: var(--ink);
            border-color: var(--line)
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .9rem;
            color: var(--muted);
            margin-left: auto;
            cursor: pointer
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .msg {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            font-size: .95rem
        }

        .bot {
            background: var(--bot);
            align-self: flex-start
        }

        .user {
            background: var(--accent);
            color: #fff;
            align-self: flex-end
        }

        .empty {
            margin: auto;
            text-align: center;
            color: var(--muted);
            max-width: 340px
        }

        #status {
            padding: 0 24px 8px;
            font-size: .82rem;
            color: var(--muted);
            min-height: 22px
        }

        form {
            display: flex;
            gap: 10px;
            padding: 16px 24px;
            border-top: 1px solid var(--line)
        }

        form input {
            flex: 1
        }

        #mic {
            width: 46px;
            padding: 9px 0
        }

        #mic.on {
            background: var(--rec);
            color: #fff;
            border-color: var(--rec);
            animation: pulse 1.2s infinite
        }

        @keyframes pulse {
            50% {
                box-shadow: 0 0 0 6px rgba(217, 45, 32, .18)
            }
        }

        @media (prefers-reduced-motion:reduce) {
            #mic.on {
                animation: none
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header>
            <h1>Interview Coach</h1>
            <p>Practice a mock interview by typing or speaking. Get a score and feedback after every answer.</p>
        </header>

        <div class="setup">
            <select id="role" aria-label="Role">
                <option>Python Developer</option>
                <option>Data Analyst</option>
                <option>Machine Learning Engineer</option>
                <option>Web Developer</option>
                <option>Software Engineer</option>
            </select>
            <select id="level" aria-label="Level">
                <option>Junior</option>
                <option>Mid-level</option>
                <option>Senior</option>
            </select>
            <button id="start">Start interview</button>
            <button id="reset" class="ghost">New session</button>
            <label class="toggle"><input type="checkbox" id="ttsOn" checked> Read replies aloud</label>
            <button id="stopVoice" class="ghost" type="button">Stop voice</button>
        </div>

        <section id="chat" aria-live="polite">
            <div class="empty">Choose a role and level, then select Start interview.</div>
        </section>

        <div id="status"></div>

        <form id="form">
            <button type="button" id="mic" class="ghost" aria-label="Speak your answer"
                title="Speak your answer">🎤</button>
            <input type="text" id="input" placeholder="Type or speak your answer..." autocomplete="off" disabled>
            <button id="send" disabled>Send</button>
        </form>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        let sid = crypto.randomUUID(), busy = false;

        /* ---------- helpers ---------- */
        const setStatus = t => $("status").textContent = t || "";
        const scrollDown = () => $("chat").scrollTop = $("chat").scrollHeight;
        const EMPTY = '<div class="empty">Choose a role and level, then select Start interview.</div>';

        function add(text, who) {
            const empty = document.querySelector(".empty"); if (empty) empty.remove();
            const d = document.createElement("div");
            d.className = "msg " + who; d.textContent = text;
            $("chat").appendChild(d); scrollDown();
            return d;
        }
        function lockInputs(lock) {
            $("input").disabled = $("send").disabled = $("mic").disabled = lock;
            $("start").disabled = lock;
        }

        /* ---------- text to speech ---------- */
        const synth = window.speechSynthesis;
        function speak(text) {
            if (!synth || !$("ttsOn").checked) return;
            synth.cancel();
            // split into sentences: avoids Chrome cutting off long utterances
            const parts = text.replace(/\s+/g, " ").match(/[^.!?:]+[.!?:]*/g) || [text];
            parts.forEach(p => { if (p.trim()) synth.speak(new SpeechSynthesisUtterance(p.trim())); });
        }
        const stopSpeaking = () => synth && synth.cancel();
        $("stopVoice").onclick = stopSpeaking;
        $("ttsOn").onchange = () => { if (!$("ttsOn").checked) stopSpeaking(); };
        if (!synth) { $("ttsOn").parentElement.style.display = "none"; $("stopVoice").style.display = "none"; }

        /* ---------- speech to text ---------- */
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec = null, listening = false, base = "";
        if (!SR) {
            $("mic").style.display = "none";
        } else {
            rec = new SR();
            rec.lang = "en-US";
            rec.interimResults = true;
            rec.continuous = true;
            rec.onresult = e => {
                let t = "";
                for (const r of e.results) t += r[0].transcript;
                $("input").value = base + t;
            };
            rec.onerror = e => {
                const msg = e.error === "not-allowed" ? "Microphone blocked. Allow mic access in the browser address bar."
                    : e.error === "no-speech" ? "No speech detected. Try again."
                        : "Voice error: " + e.error;
                setStatus(msg);
            };
            rec.onend = () => { listening = false; $("mic").classList.remove("on"); if ($("status").textContent === "Listening...") setStatus(""); };
        }
        $("mic").onclick = () => {
            if (!rec) return;
            if (listening) { rec.stop(); return; }
            stopSpeaking();                       // don't record the bot's own voice
            base = $("input").value ? $("input").value.trim() + " " : "";
            try { rec.start(); } catch { return; }
            listening = true; $("mic").classList.add("on"); setStatus("Listening...");
        };

        /* ---------- chat ---------- */
        async function ask(message) {
            if (busy) return; busy = true;
            if (listening && rec) rec.stop();
            stopSpeaking();
            lockInputs(true);
            const bubble = add("...", "bot");
            try {
                const res = await fetch("/chat", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sid, role: $("role").value, level: $("level").value, message })
                });
                const reader = res.body.getReader(), dec = new TextDecoder();
                bubble.textContent = "";
                while (true) {
                    const { done, value } = await reader.read(); if (done) break;
                    bubble.textContent += dec.decode(value, { stream: true });
                    scrollDown();
                }
                speak(bubble.textContent);          // read the full reply once streaming ends
            } catch {
                bubble.textContent = "Connection failed. Check that the server and Ollama are running.";
            }
            busy = false; lockInputs(false); $("input").focus();
        }

        $("start").onclick = () => {
            $("chat").innerHTML = ""; setStatus("");
            fetch("/reset/" + sid, { method: "POST" });
            ask("Start the interview.");
        };
        $("reset").onclick = () => {
            stopSpeaking(); if (listening && rec) rec.stop();
            fetch("/reset/" + sid, { method: "POST" });
            sid = crypto.randomUUID();
            $("chat").innerHTML = EMPTY; $("input").value = ""; setStatus("");
            lockInputs(true); $("start").disabled = false;
        };
        $("form").onsubmit = e => {
            e.preventDefault();
            const t = $("input").value.trim(); if (!t) return;
            $("input").value = ""; add(t, "user"); ask(t);
        };
        window.addEventListener("beforeunload", stopSpeaking);
    </script>
</body>

</html>
